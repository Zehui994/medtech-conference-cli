name: Auto Crawl & Notify
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  crawl-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawl script & save output
        run: |
          python example_usage.py > output.txt
          cat output.txt

      - name: Send email with conference info
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.SMTP_SENDER }}
          to: yangzehui994@gmail.com
          subject: 医学会议最新信息
          body: |
            今日抓取到的会议信息如下：
            
            ${{ env.MAIL_CONTENT }}
            
            自动发送，无需回复。
          convert_markdown: true
