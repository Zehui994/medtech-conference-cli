name: Auto Crawl & Notify
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  crawl-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawl script
        run: python example_usage.py

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: yangzehui994@gmail.com
          password: 你的Gmail应用专用密码
          from: yangzehui994@gmail.com
          to: yangzehui994@gmail.com
          subject: 会议信息更新通知
          body: 最新会议数据已抓取完成！
